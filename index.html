<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ladybug Shell Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', 'Droid Sans Mono', 'Source Code Pro', monospace;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #252526;
      padding: 12px 16px;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-spacer {
      flex: 1;
    }
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #569cd6;
    }
    .status {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #3c3c3c;
    }
    .status.loading {
      background: #dcdcaa;
      color: #1e1e1e;
    }
    .status.ready {
      background: #4ec9b0;
      color: #1e1e1e;
    }
    .status.error {
      background: #f14c4c;
      color: #fff;
    }
    .package-version {
      color: #9cdcfe;
      font-size: 12px;
      white-space: nowrap;
    }
    .destructive-button {
      background: #8b1e1e;
      border: 1px solid #f14c4c;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      white-space: nowrap;
    }
    .destructive-button:hover {
      background: #a62a2a;
    }
    .destructive-button:focus-visible {
      outline: 2px solid #ff8a8a;
      outline-offset: 2px;
    }
    .destructive-button:disabled {
      background: #4a2a2a;
      border-color: #6a3a3a;
      color: #b8a0a0;
      cursor: not-allowed;
    }
    .toolbar-button {
      background: #2d2d2d;
      border: 1px solid #569cd6;
      border-radius: 4px;
      color: #d4d4d4;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      white-space: nowrap;
    }
    .toolbar-button:hover {
      background: #373737;
    }
    .toolbar-button:focus-visible {
      outline: 2px solid #9cdcfe;
      outline-offset: 2px;
    }
    .toolbar-button:disabled {
      border-color: #4a4a4a;
      color: #777;
      cursor: not-allowed;
    }
    .open-dialog {
      background: #252526;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      color: #d4d4d4;
      font-family: inherit;
      max-width: min(720px, calc(100vw - 32px));
      padding: 0;
      width: 720px;
    }
    .open-dialog::backdrop {
      background: rgb(0 0 0 / 60%);
    }
    .open-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
    }
    .open-form h2 {
      color: #569cd6;
      font-size: 14px;
      margin: 0;
    }
    .open-form label {
      color: #9cdcfe;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }
    .open-form input {
      background: #1e1e1e;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      color: #d4d4d4;
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      width: 100%;
    }
    .open-form input:focus {
      border-color: #569cd6;
      outline: none;
    }
    .open-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .terminal {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }
    .output-line {
      margin: 4px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .output-line.error {
      color: #f14c4c;
    }
    .output-line.success {
      color: #4ec9b0;
    }
    .output-line.info {
      color: #9cdcfe;
    }
    .output-line.result {
      color: #d4d4d4;
    }
    .output-line table {
      border-collapse: collapse;
      margin: 8px 0;
    }
    .output-line td, .output-line th {
      border: 1px solid #3c3c3c;
      padding: 4px 8px;
    }
    .output-line th {
      background: #2d2d2d;
    }
    .input-area {
      background: #252526;
      padding: 12px 16px;
      border-top: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prompt {
      color: #4ec9b0;
      font-weight: bold;
    }
    #command-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #d4d4d4;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      resize: none;
      min-height: 24px;
    }
    #command-input::placeholder {
      color: #6a6a6a;
    }
    .help-panel {
      background: #252526;
      padding: 12px 16px;
      border-bottom: 1px solid #3c3c3c;
      font-size: 12px;
      color: #6a6a6a;
    }
    .help-panel kbd {
      background: #3c3c3c;
      padding: 2px 6px;
      border-radius: 3px;
      color: #d4d4d4;
    }
  </style>
  <script src="/sw.js"></script>
</head>
<body>
  <div class="header">
    <h1>🐞 Ladybug Shell</h1>
    <span id="status" class="status loading">Loading WASM...</span>
    <button id="open-url-button" class="toolbar-button" type="button" title="Open a .cypher script or .lbdb database">
      Open URL
    </button>
    <button id="reset-db-button" class="destructive-button" type="button" title="Deletes all persistent OPFS database data for this shell and recreates it">
      Delete Database
    </button>
    <span class="header-spacer"></span>
    <span id="wasm-core-version" class="package-version"></span>
  </div>

  <div class="help-panel">
    Press <kbd>Enter</kbd> to execute • Type <kbd>help</kbd> for commands • Use <kbd>↑</kbd><kbd>↓</kbd> for history
  </div>

  <div class="terminal" id="terminal"></div>

  <div class="input-area">
    <span class="prompt">lbug></span>
    <textarea id="command-input" placeholder="Enter Cypher query or command..." autocomplete="off" autofocus rows="1"></textarea>
  </div>

  <dialog id="open-url-dialog" class="open-dialog">
    <form id="open-url-form" class="open-form">
      <h2>Open URL</h2>
      <label>
        URL
        <input id="open-url-input" name="url" type="text" spellcheck="false" placeholder="xet://datasets/ladybugdb/small-kgs/main/kg_history/icebug-disk/schema.cypher" autocomplete="off">
      </label>
      <div class="open-actions">
        <button class="toolbar-button" type="button" id="open-url-cancel-button">Cancel</button>
        <button class="toolbar-button" type="submit">Open</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/main.js"></script>
</body>
</html>
